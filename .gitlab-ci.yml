image: docker:24.0.7  # You can use the latest stable version

services:
  - docker:24.0.7-dind

variables:
  DOCKER_TLS_CERTDIR: ""  # Required to disable TLS for easier usage
  DOCKER_HOST: tcp://docker:2375  # Connect to DinD service

stages:
  - build_push

docker-build-push:
    image: docker:24.0.7
    stage: build_push
    before_script:
        - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    script:
        - docker compose build
        - docker compose push
